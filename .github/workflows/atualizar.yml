name: Atualizar resultados

on:
  schedule:
    - cron: '17 */2 * * *'   # a cada 2 horas
  workflow_dispatch:          # botão "Run workflow" para rodar na hora

permissions:
  contents: write

jobs:
  atualizar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: node scripts/atualizar.js
      - name: Salvar se mudou
        run: |
          if git diff --quiet; then echo "Sem mudanças"; exit 0; fi
          git config user.name "atualizador-brigadefoice"
          git config user.email "actions@users.noreply.github.com"
          git add public/index.html
          git commit -m "Atualiza resultados do Brasileirão"
          git push
