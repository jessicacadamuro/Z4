<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Simulador Brasileirão 2026</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600;700;800&family=Barlow:wght@400;500;600;700&display=swap">
<meta name="description" content="Simulador da reta final do Brasileirão Série A 2026: luta contra o Z4, briga pela Libertadores e chances de cada time.">
<script async src="https://pagead2.googlesyndication.com/pagead/js/adsbygoogle.js?client=ca-pub-9404395242099998"
     crossorigin="anonymous"></script>
<style>:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0}img{max-width:100%}[hidden]{display:none!important}</style>
<style>
/* Layout: papel creme do logo Briga de Foice. Logo no alto; faixa fixa com o time em destaque; abas; tabela à esquerda (no celular, presa sob a faixa com rolagem própria) e jogos à direita. */
:root{
  --bg:#efe9dd;
  --surface:#e7e0d0;
  --surface-2:#ddd4c1;
  --line:#c9bea6;
  --fg:#1b1915;
  --muted:#675f52;
  --faint:#8c8373;
  --gre:#1b1915;
  --gre-tint:color-mix(in srgb,var(--gre) 12%,transparent);
  --hl-ink:#fff;
  --stripe:linear-gradient(var(--gre),var(--gre));
  --red:#d2302b;
  --red-tint:rgba(210,48,43,.13);
  --green:#1f8f55;
  --green-tint:rgba(31,143,85,.15);
  --green-tint-2:rgba(31,143,85,.07);
  --amber:#a8670f;
  --amber-tint:rgba(214,150,40,.2);
  --ok:#1f8f55;
  --ok-tint:rgba(31,143,85,.13);
  --wood:#8a5a2b;
  --font-display:"Barlow Condensed","Arial Narrow",Arial,sans-serif;
  --font-body:"Barlow",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  --top-h:64px;
  color-scheme:light;
}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--fg);font-family:var(--font-body);font-size:15px;line-height:1.45;-webkit-font-smoothing:antialiased}
button{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--fg);outline-offset:2px}
.num{font-variant-numeric:tabular-nums}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}

/* Faixa do topo */
.topbar{position:sticky;top:env(safe-area-inset-top,0px);z-index:30;background:var(--bg);border-bottom:1px solid var(--line);
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:10px}
.topbar-in{max-width:1220px;margin:0 auto;display:flex;align-items:center;gap:12px;flex-wrap:wrap}
.stripe{width:10px;align-self:stretch;min-height:40px;border-radius:2px;background:var(--stripe);box-shadow:0 0 0 1px var(--line)}
.has-hl .stripe{display:block}
.stripe{display:none}
.gind{display:flex;align-items:center;gap:10px;flex-wrap:wrap;min-width:0}
.hl-btn{display:inline-flex;align-items:center;gap:6px;background:var(--surface-2);border:1px solid var(--line);border-radius:8px;padding:4px 8px;cursor:pointer;min-height:44px}
.hl-btn:hover{border-color:var(--faint)}
.hl-btn.empty{border-style:dashed;border-color:var(--faint);padding:8px 12px;font-weight:600;color:var(--fg)}
.hl-btn .chev{font-size:11px;color:var(--muted)}
.shield{width:20px;height:20px;color:var(--muted)}
.gind-name{font-family:var(--font-display);font-weight:700;font-size:15px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.gind-pos{font-family:var(--font-display);font-weight:800;font-size:34px;line-height:1}
.gind-pts{color:var(--muted);font-size:14px}
.chips{display:flex;gap:6px;flex-wrap:wrap}
.chip{display:inline-flex;align-items:center;gap:5px;font-size:12px;font-weight:600;letter-spacing:.04em;text-transform:uppercase;padding:3px 8px;border-radius:4px;border:1px solid transparent;white-space:nowrap}
.chip.red{background:var(--red-tint);color:var(--red);border-color:color-mix(in srgb,var(--red) 40%,transparent)}
.chip.ok{background:var(--ok-tint);color:var(--ok);border-color:color-mix(in srgb,var(--ok) 40%,transparent)}
.chip.neutral{background:var(--surface-2);color:var(--muted);border-color:var(--line)}
.chip.amber{background:var(--amber-tint);color:var(--amber);border-color:color-mix(in srgb,var(--amber) 40%,transparent);text-transform:none;letter-spacing:0;white-space:normal}
.topbar .spacer{flex:1}
.app-title{font-family:var(--font-display);font-weight:600;font-size:14px;letter-spacing:.1em;text-transform:uppercase;color:var(--faint)}
.hlmenu{position:fixed;z-index:40;top:calc(var(--top-h) + env(safe-area-inset-top,0px) + 4px);left:max(16px,env(safe-area-inset-left,0px));right:max(16px,env(safe-area-inset-right,0px));max-width:460px;background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:10px;box-shadow:0 14px 30px rgba(60,40,10,.25)}
.hlmenu p{margin:2px 4px 8px;font-size:12px;color:var(--muted);text-transform:uppercase;letter-spacing:.08em;font-weight:600}
.hlgrid{display:grid;grid-template-columns:1fr 1fr;gap:4px}
.hlmenu button{display:flex;align-items:center;gap:8px;background:none;border:1px solid transparent;border-radius:6px;padding:6px 8px;cursor:pointer;font-weight:600;text-align:left;font-size:14px;min-width:0}
.hlmenu button:hover{background:var(--surface-2)}
.hlmenu button[aria-checked="true"]{border-color:var(--fg);background:var(--surface-2)}
.hlmenu .none{grid-column:1/-1;color:var(--muted);font-weight:500}

.brand{display:flex;justify-content:center;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:14px 6px}
.brand img{display:block;width:100%;max-width:380px;height:auto}
.brand img.keying{visibility:hidden}
@media (max-width:600px){.brand img{max-width:250px}.brand{padding-block:8px 2px}}
.wrap{max-width:1220px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:12px 96px}

/* Abas */
.tabs{display:flex;gap:2px;margin-bottom:16px;border-bottom:1px solid var(--line);overflow-x:auto;scrollbar-width:none}
.tabs::-webkit-scrollbar{display:none}
.tab{flex:none;background:none;border:0;border-bottom:3px solid transparent;padding:8px 12px;margin-bottom:-1px;cursor:pointer;font-family:var(--font-display);font-weight:700;font-size:17px;letter-spacing:.04em;text-transform:uppercase;color:var(--muted);white-space:nowrap}
.tab[aria-selected="true"]{color:var(--fg);border-bottom-color:var(--fg)}
.tab:hover{color:var(--fg)}
@media (max-width:919px){
  .tabs{display:grid;grid-template-columns:1fr 1fr;grid-template-rows:auto auto;grid-auto-flow:column;gap:6px;border-bottom:0;overflow:visible}
  .tab{margin:0;border:1px solid var(--line);border-radius:6px;background:var(--surface);padding:10px 8px;font-size:15px;white-space:normal;text-align:center;line-height:1.1}
  .tab[aria-selected="true"]{background:var(--fg);color:var(--bg);border-color:var(--fg)}
}

.layout{display:grid;gap:20px}
@media (min-width:920px){
  .layout{grid-template-columns:400px minmax(0,1fr);align-items:start}
  .side{position:sticky;top:calc(var(--top-h) + 12px + env(safe-area-inset-top,0px))}
  .side.nosticky{position:static}
}

@media (max-width:919px){
  .app-title{display:none}
  .gind-pos{font-size:28px}
  .side.is-table{position:sticky;top:calc(var(--top-h) + env(safe-area-inset-top,0px));z-index:20;max-height:44vh;overflow-y:auto;overscroll-behavior:contain;scrollbar-width:none;padding:8px 10px;box-shadow:0 12px 18px -12px rgba(60,40,10,.45)}
  .side.is-table::-webkit-scrollbar{display:none}
  .side.is-table .st-head{position:sticky;top:-8px;background:var(--surface);z-index:1;margin:-8px -10px 4px;padding:8px 10px 4px}
  .side.is-table .tb td{height:30px;padding-block:3px;font-size:14px}
  .side.is-table .tb td.pos{font-size:16px}
  .side.is-table .tb .cr{width:18px;height:18px}
  .side.is-table .tb thead{display:none}
  .main{scroll-margin-top:calc(var(--top-h) + 46vh)}
}

/* Tabela */
.side{background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:12px;min-width:0}
.st-head{display:flex;align-items:center;gap:8px;margin-bottom:8px}
.st-head h2{margin:0;font-family:var(--font-display);font-weight:700;font-size:20px;letter-spacing:.03em;text-transform:uppercase}
.st-head .count{color:var(--muted);font-size:13px;white-space:nowrap;margin-left:auto}
.btn{border:1px solid var(--line);background:var(--surface-2);border-radius:6px;padding:6px 10px;font-size:13px;font-weight:600;cursor:pointer}
.btn:hover{border-color:var(--faint)}
.btn.danger{color:var(--red)}
.btn.amber{background:var(--amber);color:#fff;border-color:var(--amber)}
table.tb{width:100%;border-collapse:separate;border-spacing:0 3px;table-layout:fixed}
col.c-pos{width:50px}col.c-pts{width:64px}col.c-j{width:56px}
.tb th{font-family:var(--font-display);font-weight:600;font-size:13px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);text-align:left;padding:2px 8px;vertical-align:middle}
.tb th.r,.tb td.r{text-align:right}
.tb td{padding:7px 8px;background:var(--surface-2);font-size:15px;line-height:22px;height:38px;vertical-align:middle}
.tb.compact td{height:32px;padding-block:4px;font-size:14px}
.tb.compact .cr{width:18px;height:18px}
.tb td:first-child{border-radius:5px 0 0 5px}
.tb td:last-child{border-radius:0 5px 5px 0}
.tb td.pos{font-family:var(--font-display);font-weight:700;font-size:18px}
.tb td.pts{font-weight:700}
.tb td.club{overflow:hidden}
.tb tbody tr{cursor:pointer}
.tb tbody tr:hover td{filter:brightness(1.18)}
.tb tbody tr.sel td{box-shadow:inset 0 1px 0 var(--fg),inset 0 -1px 0 var(--fg)}
.tb tbody tr.sel td:first-child{box-shadow:inset 0 1px 0 var(--fg),inset 0 -1px 0 var(--fg),inset 1px 0 0 var(--fg)}
.tb tbody tr.sel td:last-child{box-shadow:inset 0 1px 0 var(--fg),inset 0 -1px 0 var(--fg),inset -1px 0 0 var(--fg)}
.club-in{display:flex;align-items:center;gap:8px;min-width:0}
.club-in .nm{min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.cr{width:22px;height:22px;object-fit:contain;flex:none;display:block}
.cr.sm{width:18px;height:18px}
.cr.lg{width:34px;height:34px}
tr.g5 td.pos{background:var(--green);color:#fff}
tr.g5 td{background:var(--green-tint)}
tr.g7 td.pos{box-shadow:inset 3px 0 0 var(--green)}
tr.g7 td{background:var(--green-tint-2)}
tr.zone td.pos{background:var(--red);color:#fff}
tr.zone td{background:var(--red-tint)}
tr.fixed td{color:var(--muted)}
tr.fixed td.pos{color:#fff}
tr.g5.fixed td.pos{color:#fff}
.ftag{flex:none;margin-left:auto;font-size:10px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;border-radius:3px;padding:0 5px;border:1px solid}
.ftag.red{color:var(--red);border-color:color-mix(in srgb,var(--red) 50%,transparent)}
.ftag.green{color:var(--green);border-color:color-mix(in srgb,var(--green) 50%,transparent)}
tr.hl td{background:var(--gre-tint)}
tr.hl td.club{font-weight:700}
tr.hl td.pos{position:relative;padding-left:14px}
tr.hl td.pos::before{content:"";position:absolute;left:0;top:0;bottom:0;width:6px;border-radius:5px 0 0 5px;background:var(--stripe)}
tr.hl.zone td{background:linear-gradient(90deg,var(--red-tint),var(--gre-tint))}
tr.hl.g5 td{background:linear-gradient(90deg,var(--green-tint),var(--gre-tint))}
tr.tie td.club,tr.tie td.pts{color:var(--amber)}
.warn-ico{width:16px;height:16px;flex:none;color:var(--amber)}
.legend{font-size:12.5px;color:var(--muted);margin-top:8px;display:grid;gap:4px}
.legend span{display:flex;gap:6px;align-items:center}
.sw{display:inline-block;width:12px;height:12px;border-radius:2px;flex:none}
.sw.red{background:var(--red)}.sw.green{background:var(--green)}.sw.g7{background:var(--green-tint);box-shadow:inset 3px 0 0 var(--green)}
.hint{font-size:12.5px;color:var(--faint);margin-top:6px}
.ties{display:grid;gap:8px;margin-top:10px}
.tie-box{border:1px solid color-mix(in srgb,var(--amber) 45%,transparent);background:var(--amber-tint);border-radius:6px;padding:10px;display:grid;gap:8px}
.tie-box p{margin:0;font-size:14px}
.tie-box .sub{font-size:12.5px;color:var(--muted)}
.tie-box .persist{color:var(--amber);font-weight:600;font-size:13px}
.st-foot{display:flex;justify-content:flex-end;margin-top:10px}

/* Jogos */
.main{display:grid;gap:18px;min-width:0}
.filter-head{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.filter-head h3{margin:0;display:flex;align-items:center;gap:10px;font-family:var(--font-display);font-weight:800;font-size:24px;text-transform:uppercase}
.round h3{margin:0 0 8px;display:flex;align-items:baseline;gap:10px;font-family:var(--font-display);font-weight:800;font-size:24px;letter-spacing:.02em;text-transform:uppercase}
.round h3 small{font-family:var(--font-body);font-size:13px;font-weight:500;color:var(--muted);text-transform:none;letter-spacing:0}
.acc{border:1px solid var(--line);border-radius:8px;background:var(--surface)}
.acc+.acc{margin-top:-10px}
.acc-btn{width:100%;display:flex;align-items:center;gap:10px;background:none;border:0;padding:12px 14px;cursor:pointer;text-align:left}
.acc-btn .t{font-family:var(--font-display);font-weight:800;font-size:22px;text-transform:uppercase}
.acc-btn .d{color:var(--muted);font-size:13px}
.acc-btn .c{margin-left:auto;color:var(--muted);font-size:13px}
.acc-btn .c.done{color:var(--ok)}
.acc-btn .ar{color:var(--muted);transition:transform .15s}
.acc-btn[aria-expanded="true"] .ar{transform:rotate(90deg)}
.acc-body{padding:0 12px 12px}
.games{display:grid;gap:8px}
@media (min-width:640px){.games{grid-template-columns:1fr 1fr}}
@media (min-width:920px) and (max-width:1120px){.games{grid-template-columns:1fr}}
.game{background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:10px;display:grid;gap:8px;position:relative}
.acc .game{background:var(--surface-2)}
.game.hl{border-color:var(--gre);background:linear-gradient(180deg,var(--gre-tint),transparent 70%),var(--surface);padding-left:18px}
.game.hl::before{content:"";position:absolute;left:0;top:0;bottom:0;width:7px;border-radius:8px 0 0 8px;background:var(--stripe)}
.g-meta{display:flex;gap:8px;align-items:center;font-size:12.5px;color:var(--muted);flex-wrap:wrap}
.tag{font-size:11px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;padding:1px 6px;border-radius:3px;border:1px solid var(--line);color:var(--muted)}
.tag.direct{color:var(--fg);border-color:var(--faint)}
.tag.hl{color:var(--fg);border-color:var(--gre);background:var(--gre-tint)}
.g-btns{display:grid;grid-template-columns:1fr auto 1fr;gap:6px}
.opt{min-height:44px;padding:6px 8px;border-radius:6px;border:1px solid var(--line);background:var(--surface-2);cursor:pointer;font-weight:600;font-size:14px;line-height:1.15;overflow-wrap:anywhere}
.acc .opt{background:var(--surface)}
.opt-in{display:flex;flex-direction:column;align-items:center;gap:4px}
.opt.draw{font-weight:500;color:var(--muted);padding-inline:12px}
.opt:hover{border-color:var(--faint)}
.opt[aria-pressed="true"]{background:var(--fg);color:var(--bg);border-color:var(--fg)}
.game.hl .opt.hl-side[aria-pressed="true"]{background:var(--gre);border-color:var(--gre);color:var(--hl-ink)}
.g-score{font-size:12.5px;color:var(--amber)}

/* Por time */
.seg{display:inline-flex;border:1px solid var(--line);border-radius:8px;overflow:hidden}
.seg button{background:var(--surface-2);border:0;padding:8px 12px;cursor:pointer;font-weight:600;font-size:14px}
.seg button[aria-pressed="true"]{background:var(--fg);color:var(--bg)}
.tpick{display:grid;gap:6px}
@media (max-width:919px){.tpick{grid-template-columns:repeat(auto-fill,minmax(160px,1fr))}}
.tp{display:grid;grid-template-columns:auto 1fr auto;align-items:center;gap:2px 8px;padding:8px 10px;border-radius:6px;border:1px solid var(--line);background:var(--surface-2);cursor:pointer;text-align:left}
.tp:hover{border-color:var(--faint)}
.tp .cr{grid-row:1/3}
.tp .n{font-weight:600;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.tp .p{font-size:13px;color:var(--muted);text-align:right}
.tp .c{grid-column:2/4;font-size:11.5px;color:var(--muted);text-align:right}
.tp .c.some{color:var(--amber)}
.tp[aria-pressed="true"]{border-color:var(--fg);background:var(--fg);color:var(--bg)}
.tp[aria-pressed="true"] .p,.tp[aria-pressed="true"] .c{color:var(--bg);opacity:.8}
.side p.lead{margin:0 0 10px;color:var(--muted);font-size:13.5px}
.side .row{display:flex;gap:8px;align-items:center;justify-content:space-between;flex-wrap:wrap;margin:10px 0}
.result{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:16px;display:grid;gap:14px}
.result.hl{border-color:var(--gre);background:linear-gradient(180deg,var(--gre-tint),transparent 80%),var(--surface)}
.result h3{margin:0;display:flex;align-items:center;gap:10px;font-family:var(--font-display);font-weight:800;font-size:22px;text-transform:uppercase}
.kpis{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
@media (max-width:560px){.kpis{grid-template-columns:1fr}}
.kpi{background:var(--surface-2);border:1px solid var(--line);border-radius:8px;padding:12px;display:grid;gap:6px;align-content:start}
.kpi .lab{font-family:var(--font-display);font-weight:600;font-size:13px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.kpi .big{font-family:var(--font-display);font-weight:800;font-size:42px;line-height:1}
.kpi .sub{font-size:13px;color:var(--muted)}
.kpi.bad .big,.kpi.bad .meter{color:var(--red)}
.kpi.mid .big,.kpi.mid .meter{color:var(--amber)}
.kpi.good .big,.kpi.good .meter{color:var(--green)}
.meter{height:6px;border-radius:3px;background:var(--line);overflow:hidden}
.meter i{display:block;height:100%;background:currentColor}
.method{font-size:12.5px;color:var(--faint);margin:0;max-width:78ch}

/* Barra fixa da % no celular */
.tsticky{display:none}
@media (max-width:919px){
  .tsticky{display:flex;align-items:center;gap:10px;position:sticky;top:calc(var(--top-h) + env(safe-area-inset-top,0px));z-index:20;background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:8px 12px;box-shadow:0 12px 18px -12px rgba(60,40,10,.45)}
  .tsticky.hl{border-color:var(--gre)}
  .tsticky .tn{font-weight:700;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .tsticky .tp2{color:var(--muted);font-size:13px;white-space:nowrap}
  .tsticky .tv{margin-left:auto;text-align:right;line-height:1.1}
  .tsticky .tv b{display:block;font-family:var(--font-display);font-weight:800;font-size:28px}
  .tsticky .tv small{font-size:11px;color:var(--muted);text-transform:uppercase;letter-spacing:.06em}
  .tsticky.bad .tv b{color:var(--red)}.tsticky.mid .tv b{color:var(--amber)}.tsticky.good .tv b{color:var(--green)}
}

/* Data dos dados e dica de uso */
.upd{margin:-8px 0 14px;font-size:12.5px;color:var(--muted);text-align:center}
.tip{display:flex;gap:8px;align-items:center;background:var(--amber-tint);border:1px solid color-mix(in srgb,var(--amber) 35%,transparent);border-radius:6px;padding:7px 10px;font-size:13px;color:var(--fg)}
.tip svg{width:16px;height:16px;flex:none;color:var(--amber)}
.main>.tip{margin-bottom:-6px}

/* Painel de desempate */
.scrim{position:fixed;inset:0;background:rgba(27,25,21,.45);z-index:50;display:flex;justify-content:center;align-items:flex-end}
@media (min-width:720px){.scrim{align-items:center}}
.sheet{background:var(--surface);border:1px solid var(--line);border-radius:12px 12px 0 0;width:100%;max-width:640px;max-height:88vh;overflow:auto;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:16px calc(20px + env(safe-area-inset-bottom,0px))}
@media (min-width:720px){.sheet{border-radius:12px}}
.sheet-head{display:flex;align-items:flex-start;gap:10px;margin-bottom:10px}
.sheet-head h2{margin:0;font-family:var(--font-display);font-size:24px;font-weight:800;text-transform:uppercase;flex:1}
.sheet p.lead{margin:0 0 12px;color:var(--muted);font-size:14px;max-width:62ch}
.mini{width:100%;border-collapse:collapse;margin-bottom:6px;font-size:14px}
.mini th,.mini td{padding:6px 8px;border-bottom:1px solid var(--line);text-align:left}
.mini th{font-size:12px;color:var(--muted);text-transform:uppercase;letter-spacing:.06em}
.mini .r{text-align:right}
.mini tr.hl td{background:var(--gre-tint)}
.verdict{margin:6px 0 16px;font-size:14px}
.verdict.persist{color:var(--amber);font-weight:600}
.sc-list{display:grid;gap:8px}
.sc-row{display:grid;grid-template-columns:1fr auto 1fr;align-items:center;gap:8px;background:var(--surface-2);border:1px solid var(--line);border-radius:8px;padding:8px 10px;position:relative}
.sc-row.hl{border-color:var(--gre);background:var(--gre-tint);padding-left:16px}
.sc-row.hl::before{content:"";position:absolute;left:0;top:0;bottom:0;width:6px;border-radius:8px 0 0 8px;background:var(--stripe)}
.sc-row .rd{grid-column:1/-1;font-size:12px;color:var(--muted)}
.sc-row .tm{display:flex;align-items:center;gap:6px;font-weight:600;font-size:14px;min-width:0;overflow-wrap:anywhere}
.sc-row .tm.h{justify-content:flex-end;text-align:right}
.sc-in{display:flex;align-items:center;gap:6px}
.sc-in input{width:52px;height:40px;text-align:center;font-size:18px;font-weight:700;font-family:var(--font-display);background:var(--bg);color:var(--fg);border:1px solid var(--line);border-radius:6px}
.sc-in input:focus{border-color:var(--amber);outline:none;box-shadow:0 0 0 2px var(--amber-tint)}
.notices{display:grid;gap:6px;margin:12px 0}
.notice{font-size:13.5px;background:var(--amber-tint);border-left:3px solid var(--amber);padding:6px 10px}
.sheet h4{margin:16px 0 8px;font-family:var(--font-display);font-size:16px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}
.empty{color:var(--muted);font-size:14px}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(16px + env(safe-area-inset-bottom,0px));z-index:60;background:var(--fg);color:var(--bg);border-radius:8px;padding:10px 14px;font-size:14px;font-weight:500;display:flex;gap:12px;align-items:center;max-width:calc(100vw - 32px);box-shadow:0 8px 24px rgba(60,40,10,.3)}
.toast button{background:none;border:0;color:#f3c86b;font-weight:700;cursor:pointer;padding:0}
@media (prefers-reduced-motion:no-preference){.tb td,.opt{transition:background-color .15s,color .15s,border-color .15s}}
</style>
</head>

  for(const g of GAMES){if(!state.res[g.id])continue;const s=scoreOf(g);add(T[g.h],s.h,s.a);add(T[g.a],s.a,s.h)}
  return T;
}
function h2h(a,b){
  let pa=0,pb=0;
  const take=(h,x,y)=>{const fa=h===a?x:y,fb=h===a?y:x;if(fa>fb)pa+=3;else if(fa<fb)pb+=3;else{pa++;pb++}};
  for(const p of PLAYED)if((p[0]===a&&p[1]===b)||(p[0]===b&&p[1]===a))take(p[0],p[2],p[3]);
  for(const g of GAMES)if(state.res[g.id]&&((g.h===a&&g.a===b)||(g.h===b&&g.a===a))){const s=scoreOf(g);take(g.h,s.h,s.a)}
  return {pa,pb};
}
const eq4=(x,y)=>x.pts===y.pts&&x.v===y.v&&x.sg===y.sg&&x.gp===y.gp;
const totalGames=k=>GAMES.filter(g=>g.h===k||g.a===k).length+BASE[k].j;
function sortKeys(keys,T){
  const arr=keys.map(k=>({...T[k]})).sort((x,y)=>y.pts-x.pts||y.v-x.v||y.sg-x.sg||y.gp-x.gp||x.name.localeCompare(y.name));
  let i=0;
  while(i<arr.length){let j=i;while(j+1<arr.length&&eq4(arr[i],arr[j+1]))j++;const size=j-i+1;for(let k=i;k<=j;k++)arr[k].run=size;
    if(size===2){const h=h2h(arr[i].k,arr[i+1].k);if(h.pb>h.pa){const t=arr[i];arr[i]=arr[i+1];arr[i+1]=t}}i=j+1}
  // empate só entre clubes com todos os jogos simulados
  const C=arr.filter(t=>t.j===totalGames(t.k));
  const groups=[];i=0;
  while(i<C.length){
    let j=i;while(j+1<C.length&&C[j+1].pts===C[i].pts&&C[j+1].v===C[i].v)j++;
    if(j>i){
      const teams=C.slice(i,j+1),steps=[];let persist=false;
      for(let k=0;k<teams.length-1;k++){
        const x=teams[k],y=teams[k+1];
        if(x.sg!==y.sg)steps.push({x,y,c:'saldo de gols'});
        else if(x.gp!==y.gp)steps.push({x,y,c:'gols pró'});
        else if(x.run===2){const h=h2h(x.k,y.k);if(h.pa!==h.pb)steps.push({x,y,c:'confronto direto',h});else{steps.push({x,y,c:null,h});persist=true}}
        else{steps.push({x,y,c:null});persist=true}
      }
      teams.forEach(t=>{arr.find(a=>a.k===t.k).tie=true});
      groups.push({teams,steps,persist});
    }
    i=j+1;
  }
  return {arr,groups};
}
const joinNames=l=>l.length<=1?l.join(''):l.slice(0,-1).join(', ')+' e '+l[l.length-1];
const ICON='<svg class="warn-ico" viewBox="0 0 16 16" aria-hidden="true"><path fill="currentColor" d="M8 1.2 15.3 14H.7L8 1.2Z"/><path fill="#fff" d="M7.2 5.6h1.6v4.6H7.2zM7.2 11.2h1.6v1.6H7.2z"/></svg>';
const SHIELD='<svg class="shield" viewBox="0 0 24 24" aria-hidden="true"><path fill="none" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round" d="M12 3 4.5 6v5.5c0 4.6 3.1 8.2 7.5 9.5 4.4-1.3 7.5-4.9 7.5-9.5V6L12 3Z"/></svg>';
function stepText(s){
  if(!s.c)return '';
  if(s.c==='confronto direto')return `${s.x.name} fica à frente de ${s.y.name} pelo confronto direto (${s.h.pa} x ${s.h.pb} pontos nos jogos entre eles).`;
  const a=s.c==='saldo de gols'?[s.x.sg,s.y.sg]:[s.x.gp,s.y.gp];
  const f=n=>s.c==='saldo de gols'&&n>0?'+'+n:n;
  return `${s.x.name} fica à frente de ${s.y.name} por ${s.c} (${f(a[0])} x ${f(a[1])}).`;
}
function persistText(g){
  const names=[...new Set(g.steps.filter(s=>!s.c).flatMap(s=>[s.x.name,s.y.name]))];
  const why=g.steps.some(s=>!s.c&&s.x.run>2)?' O confronto direto só vale entre dois clubes.':'';
  return `Empate persiste entre ${joinNames(names)} — critérios seguintes: cartões/sorteio.${why}`;
}

/* ---------- Visões ---------- */
function cfg(v){
  if(v==='z4')return{keys:Z4,off:12,fixedTop:[],fixedEnd:Z4_FIXED,fixedTag:'Rebaixado',title:'Luta contra o Z4'};
  if(v==='lib')return{keys:LIB,off:3,fixedTop:LIB_FIXED,fixedEnd:[],fixedTag:'Libertadores',title:'Pega Liberta ou não'};
  return{keys:KEYS,off:1,fixedTop:[],fixedEnd:[],title:'Tabela completa'};
}
const viewGames=v=>v==='all'?GAMES:GAMES.filter(g=>cfg(v).keys.includes(g.h)||cfg(v).keys.includes(g.a));
function posCls(v,pos){if(pos>=17)return'zone';if(v!=='z4'&&pos<=5)return'g5';if(v!=='z4'&&pos<=7)return'g7';return''}
let lastGroups=[];
// aviso de empate só quando algum dos clubes empatados está numa zona (Libertadores até o 7º ou rebaixamento a partir do 17º)
const inZone=(v,pos)=>pos>=17||(v!=='z4'&&pos<=7);
function zoneGroups(v,arr,groups,off){
  const keep=groups.filter(g=>g.teams.some(t=>inZone(v,off+arr.findIndex(a=>a.k===t.k))));
  arr.forEach(a=>{a.tie=keep.some(g=>g.teams.some(t=>t.k===a.k))});
  return keep;
}

  sortKeys(c.fixedTop,T).arr.forEach((t,i)=>rows.push(fixedRow(t.k,1+i,true)));
  arr.forEach((t,i)=>{const pos=c.off+i;const cls=[posCls(view,pos),t.k===HL?'hl':'',t.tie?'tie':'',filter[view]===t.k?'sel':''].join(' ');
    rows.push(`<tr class="${cls}" data-team="${t.k}"><td class="pos num">${pos}º</td><td class="club"><span class="club-in">${crest(t.k)}<span class="nm">${t.name}</span>${t.tie?ICON+'<span class="sr">(empatado em pontos e vitórias)</span>':''}</span></td><td class="r pts num">${t.pts}</td><td class="r num">${t.j}</td></tr>`)});

    <div class="ties">${groups.map((g,ix)=>{
      const names=g.teams.map(t=>t.name),decided=g.steps.filter(s=>s.c).map(stepText);

      return `<div class="tie-box"><p>Empate em pontos e vitórias entre ${joinNames(names)} — o desempate depende do saldo de gols</p>
        ${g.persist?`<p class="persist">${persistText(g)}</p>`:''}

    ${games.length?`<div class="sc-list">${games.map(g=>{const s=scoreOf(g),isH=HL&&(g.h===HL||g.a===HL);return `
      <div class="sc-row${isH?' hl':''}">
        <div class="rd">${g.r===21?'21ª rodada (adiado)':g.r+'ª rodada'} · ${g.d} · ${state.sc[g.id]?'placar informado':'placar padrão'} · ${resLabel(g,state.res[g.id])}</div>
        <span class="tm h">${nm(g.h)}${crest(g.h,'sm')}</span>
        <span class="sc-in"><input id="sc-${g.id}-h" type="number" inputmode="numeric" min="0" max="20" step="1" value="${s.h}" aria-label="Gols do ${nm(g.h)}" data-id="${g.id}" data-side="h"><span>x</span><input id="sc-${g.id}-a" type="number" inputmode="numeric" min="0" max="20" step="1" value="${s.a}" aria-label="Gols do ${nm(g.a)}" data-id="${g.id}" data-side="a"></span>
        <span class="tm">${crest(g.a,'sm')}${nm(g.a)}</span>
      </div>`}).join('')}</div>`:'<p class="empty">Nenhum jogo simulado desses clubes.</p>'}`;
  $('close').onclick=closePanel;
  $('sheet').querySelectorAll('input').forEach(inp=>{inp.addEventListener('change',onScore);inp.addEventListener('keydown',e=>{if(e.key==='Enter')inp.blur()})});
}
function onScore(e){
  const inp=e.target,id=inp.dataset.id,g=GBYID[id],cur=scoreOf(g),v=parseInt(inp.value,10);
  if(!Number.isFinite(v)||v<0||v>20||String(v)!==inp.value.trim()){inp.value=cur[inp.dataset.side];toast('Use um número inteiro de 0 a 20.');return}
  const next={...cur,[inp.dataset.side]:v},oldR=state.res[id],newR=resOf(next.h,next.a);
  state.sc[id]=next;
  if(newR!==oldR){state.res[id]=newR;const msg=`${nm(g.h)} ${next.h} x ${next.a} ${nm(g.a)}: o resultado mudou de ${resLabel(g,oldR)} para ${resLabel(g,newR)}. Pontos e tabela foram atualizados.`;notices.unshift(msg);notices=notices.slice(0,4);toast(msg)}
  const fid=document.activeElement&&document.activeElement.id;render();if(fid){const f=document.getElementById(fid);f&&f.focus()}
}

/* ---------- Por time: simulação de Monte Carlo do campeonato inteiro ---------- */
const N=KEYS.length,IDX=Object.fromEntries(KEYS.map((k,i)=>[k,i]));
const AVG=PLAYED.reduce((s,p)=>s+p[2]+p[3],0)/(PLAYED.length*2);
const HOME=1.15,AWAYF=0.87,SHRINK=6;
const att=k=>(BASE[k].gp+AVG*SHRINK)/(BASE[k].j+SHRINK)/AVG;
const dff=k=>(BASE[k].gc+AVG*SHRINK)/(BASE[k].j+SHRINK)/AVG;
const GL=GAMES.map(g=>({id:g.id,h:IDX[g.h],a:IDX[g.a],lh:AVG*att(g.h)*dff(g.a)*HOME,la:AVG*att(g.a)*dff(g.h)*AWAYF}));
function rng(seed){return function(){seed|=0;seed=seed+0x6D2B79F5|0;let t=Math.imul(seed^seed>>>15,1|seed);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296}}
function pois(l,rand){const L=Math.exp(-l);let k=0,p=1;do{k++;p*=rand()}while(p>L);return k-1}
const SIMS=12000;
function monteCarlo(fixed){
  const rand=rng(20261020),pos=KEYS.map(()=>new Int32Array(N)),sum=new Float64Array(N);
  const P=new Int32Array(N),V=new Int32Array(N),S=new Int32Array(N),G=new Int32Array(N),R=new Float64Array(N),o=[...Array(N).keys()];
  const bp=KEYS.map(k=>BASE[k].pts),bv=KEYS.map(k=>BASE[k].v),bs=KEYS.map(k=>BASE[k].sg),bg=KEYS.map(k=>BASE[k].gp);
  const cmp=(x,y)=>P[y]-P[x]||V[y]-V[x]||S[y]-S[x]||G[y]-G[x]||R[x]-R[y];
  for(let s=0;s<SIMS;s++){
    for(let i=0;i<N;i++){P[i]=bp[i];V[i]=bv[i];S[i]=bs[i];G[i]=bg[i];R[i]=rand()}
    for(const g of GL){
      const want=fixed[g.id];let gh=pois(g.lh,rand),ga=pois(g.la,rand);
      if(want){let n=0;while(resOf(gh,ga)!==want&&n<30){gh=pois(g.lh,rand);ga=pois(g.la,rand);n++}if(resOf(gh,ga)!==want){const d=defScore(want);gh=d.h;ga=d.a}}
      G[g.h]+=gh;S[g.h]+=gh-ga;G[g.a]+=ga;S[g.a]+=ga-gh;
      if(gh>ga){P[g.h]+=3;V[g.h]++}else if(gh<ga){P[g.a]+=3;V[g.a]++}else{P[g.h]++;P[g.a]++}
    }
    o.sort(cmp);
    for(let i=0;i<N;i++){pos[o[i]][i]++;sum[o[i]]+=P[o[i]]}
  }
  const out={};
  KEYS.forEach((k,i)=>{const d=pos[i],cum=n=>{let c=0;for(let j=0;j<n;j++)c+=d[j];return c/SIMS};
    out[k]={down:1-cum(16),top5:cum(5),top6:cum(6),top7:cum(7),avg:sum[i]/SIMS}});
  return out;
}
let BASELINE=null;
const pct=p=>p<0.001?'<0,1%':p>0.999?'>99,9%':(p*100).toFixed(1).replace('.',',')+'%';
const teamGames=k=>GAMES.filter(g=>g.h===k||g.a===k);
function renderTeam(){
  if(!BASELINE)BASELINE=monteCarlo({});
  const grp=tst.group==='lib'?LIB:Z4;
  if(!grp.includes(tst.team))tst.team=HL&&grp.includes(HL)?HL:grp[0];
  const k=tst.team,list=teamGames(k);
  const total=Object.keys(tst.res).length;
  $('side').innerHTML=`
    <div class="st-head"><h2>% por time</h2></div>
    <div class="seg" role="group" aria-label="Grupo de clubes">
      <button type="button" data-grp="z4" aria-pressed="${tst.group==='z4'}">Luta contra o Z4</button>
      <button type="button" data-grp="lib" aria-pressed="${tst.group==='lib'}">Pega Liberta ou não</button>
    </div>
    <div class="row"><span class="hint" style="margin:0">${total} ${total===1?'jogo marcado':'jogos marcados'} no total</span><button class="btn danger" type="button" id="tclear">Limpar tudo</button></div>
    <div class="tpick">${grp.map(t=>{const tg=teamGames(t),n=tg.filter(g=>tst.res[g.id]).length;
      return `<button type="button" class="tp" data-team="${t}" aria-pressed="${t===k}">${crest(t)}<span class="n">${nm(t)}</span><span class="p num">${BASE[t].pts} pts</span><span class="c num${n?' some':''}">${n}/${tg.length} jogos selecionados</span></button>`}).join('')}</div>
    <p class="hint">Os jogos marcados valem para todos os clubes: marcar jogos de outro time muda a chance deste.</p>`;
  let pts=BASE[k].pts,set=0;
  for(const g of list){const r=tst.res[g.id];if(!r)continue;set++;const mine=g.h===k?'H':'A';pts+=r==='D'?1:r===mine?3:0}
  const missing=list.length-set,mc=monteCarlo(tst.res)[k],base=BASELINE[k];
  const isLib=tst.group==='lib';
  const p=isLib?mc.top5:mc.down,pb=isLib?base.top5:base.down;
  const cls=isLib?(p>=.5?'good':p>=.15?'mid':'bad'):(p>=.5?'bad':p>=.15?'mid':'good');
  const isH=k===HL;
  $('main').innerHTML=`
    <div class="tsticky ${cls}${isH?' hl':''}" aria-hidden="true">${crest(k)}<span class="tn">${nm(k)}</span><span class="tp2 num">${pts} pts</span><span class="tv"><small>${isLib?'Libertadores':'Cair'}</small><b class="num">${pct(p)}</b></span></div>
    <div class="games">${list.map(g=>{const r=tst.res[g.id],gH=HL&&(g.h===HL||g.a===HL),direct=grp.includes(g.h)&&grp.includes(g.a);
      return `<div class="game${gH?' hl':''}">
        <div class="g-meta"><span>${g.r===21?'Adiado · 21ª rodada':g.r+'ª rodada'}</span><span class="num">${g.d}</span>${direct?'<span class="tag direct">Confronto direto</span>':''}</div>
        <div class="g-btns" role="group" aria-label="${nm(g.h)} x ${nm(g.a)}">
          <button type="button" class="opt${g.h===HL?' hl-side':''}" data-tid="${g.id}" data-v="H" aria-pressed="${r==='H'}"><span class="opt-in">${crest(g.h)}${nm(g.h)}</span></button>
          <button type="button" class="opt draw" data-tid="${g.id}" data-v="D" aria-pressed="${r==='D'}">Empate</button>
          <button type="button" class="opt${g.a===HL?' hl-side':''}" data-tid="${g.id}" data-v="A" aria-pressed="${r==='A'}"><span class="opt-in">${crest(g.a)}${nm(g.a)}</span></button>
        </div></div>`}).join('')}</div>
    <section class="result${isH?' hl':''}" aria-live="polite">
      <h3>${crest(k,'lg')}${nm(k)} com esses resultados</h3>
      <div class="kpis">
        <div class="kpi"><span class="lab">Pontos</span><span class="big num">${pts}</span>
          <span class="sub">${missing?`${set} de ${list.length} jogos escolhidos. Com os ${missing} restantes sorteados, a média final fica em ${mc.avg.toFixed(1).replace('.',',')}.`:'Pontuação final em 38 jogos.'}</span></div>
        <div class="kpi ${cls}"><span class="lab">${isLib?'Chance de Libertadores':'Chance de cair'}</span><span class="big num">${pct(p)}</span>
          <div class="meter" aria-hidden="true"><i style="width:${(p*100).toFixed(1)}%"></i></div>
          <span class="sub">${isLib?`Termina no G5. Se abrir G6: ${pct(mc.top6)} · G7: ${pct(mc.top7)}.`:'Termina do 17º ao 20º.'}</span></div>
        <div class="kpi"><span class="lab">Sem marcar nada</span><span class="big num">${pct(pb)}</span><span class="sub">Chance antes de qualquer resultado marcado.</span></div>
      </div>
      <p class="method">${SIMS.toLocaleString('pt-BR')} simulações do campeonato inteiro. Os jogos não marcados são sorteados por um modelo de Poisson: média de gols da Série A 2026, ataque e defesa de cada clube (gols pró e contra por jogo, puxados levemente para a média) e vantagem de mando. Desempate por pontos, vitórias, saldo e gols pró. O G6 e o G7 dependem dos finalistas da Copa do Brasil e do campeão da Libertadores.</p>
    </section>`;
}
$('side').addEventListener('click',e=>{
  if(view!=='team')return;
  const gb=e.target.closest('[data-grp]');if(gb){tst.group=gb.dataset.grp;render();return}
  const tb=e.target.closest('.tp[data-team]');if(tb){tst.team=tb.dataset.team;render();return}
  if(e.target.closest('#tclear')){if(!Object.keys(tst.res).length){toast('Nenhum jogo marcado.');return}const u=JSON.parse(JSON.stringify(tst.res));tst.res={};render();toast('Todos os jogos desmarcados.',()=>{tst.res=u;render()})}
});

/* ---------- Geral ---------- */
let toastT=null;
function toast(msg,onUndo){
  const t=$('toast');t.innerHTML='';const s=document.createElement('span');s.textContent=msg;t.appendChild(s);
  if(onUndo){const b=document.createElement('button');b.type='button';b.textContent='Desfazer';b.onclick=()=>{t.hidden=true;onUndo()};t.appendChild(b)}
  t.hidden=false;clearTimeout(toastT);toastT=setTimeout(()=>t.hidden=true,onUndo?6000:4200);
}
window.addEventListener('resize',layoutFix);
try{new ResizeObserver(layoutFix).observe($('topbar'))}catch(e){}
applyHL();
render();
/* ---------- Logo sem o fundo: o creme da imagem vira transparente ---------- */
(function(){
  const img=$('logo');if(!img)return;
  const show=()=>img.classList.remove('keying');
  const run=()=>{
    try{
      const W=800,H=Math.round(W*img.naturalHeight/img.naturalWidth);
      const c=document.createElement('canvas');c.width=W;c.height=H;
      const x=c.getContext('2d');x.drawImage(img,0,0,W,H);
      const d=x.getImageData(0,0,W,H),p=d.data;
      const at=(i,j)=>(j*W+i)*4,pts=[[4,4],[W-5,4],[4,H-5],[W-5,H-5],[W>>1,4],[4,H>>1],[W-5,H>>1]];
      let br=0,bg=0,bb=0;pts.forEach(([i,j])=>{const k=at(i,j);br+=p[k];bg+=p[k+1];bb+=p[k+2]});
      br/=pts.length;bg/=pts.length;bb/=pts.length;
      for(let k=0;k<p.length;k+=4){
        const dist=Math.max(Math.abs(p[k]-br),Math.abs(p[k+1]-bg),Math.abs(p[k+2]-bb));
        const a=Math.min(1,Math.max(0,(dist-14)/30));
        if(a<=0){p[k+3]=0;continue}
        if(a<1){p[k]=Math.min(255,Math.max(0,(p[k]-br*(1-a))/a));p[k+1]=Math.min(255,Math.max(0,(p[k+1]-bg*(1-a))/a));p[k+2]=Math.min(255,Math.max(0,(p[k+2]-bb*(1-a))/a))}
        p[k+3]=Math.round(a*255);
      }
      x.putImageData(d,0,0);
      img.onload=show;img.src=c.toDataURL('image/png');
    }catch(e){show()}
  };
  img.onerror=show;
  if(img.complete&&img.naturalWidth)run();else img.addEventListener('load',run,{once:true});
  setTimeout(show,3000);
})();
})();
</script>
